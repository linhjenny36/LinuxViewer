[package]
name = "uvview"
version = "0.1.0"
edition = "2021"
description = "LinuxViewer: UltraViewer client for Linux with screen, mouse, keyboard and computer audio (port of MacViewer)"
license = "MIT"

[dependencies]
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
getrandom = "0.3"
libc = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }
md-5 = "0.10"
png = "0.17"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha1 = "0.10"
webpki-roots = "1"
winit = "0.30"
zstd-safe = "7"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "wayland", "x11"] }
egui_glow = { version = "0.37", features = ["winit"] }
glutin = "0.32"
glutin-winit = "0.5"
keyring = "4"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
