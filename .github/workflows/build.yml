name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_LTO: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  meta:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      bin: ${{ steps.v.outputs.bin }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          META=$(cargo metadata --no-deps --format-version 1)
          VER=$(echo "$META" | jq -r '.packages[0].version')
          BIN=$(echo "$META" | jq -r '[.packages[].targets[] | select(.kind[] == "bin") | .name][0]')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VER}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/desktop/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: [test, meta]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,      arch: amd64 }
          - { target: aarch64-unknown-linux-musl,     arch: arm64 }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
          - { target: arm-unknown-linux-musleabihf,   arch: armv6 }
          - { target: i686-unknown-linux-musl,        arch: "386" }
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --release --locked --target "$TARGET"

      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name'); do
            cp "target/$TARGET/release/$bin" "dist/$bin-linux-$ARCH"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            images: alpine:latest debian:stable-slim ubuntu:18.04 fedora:latest archlinux:latest busybox:latest
          - arch: arm64
            platform: linux/arm64
            images: alpine:latest debian:stable-slim ubuntu:18.04 fedora:latest busybox:latest
          - arch: armv7
            platform: linux/arm/v7
            images: alpine:latest debian:stable-slim ubuntu:18.04 busybox:latest
          - arch: armv6
            platform: linux/arm/v6
            images: alpine:latest busybox:latest
          - arch: "386"
            platform: linux/386
            images: alpine:latest busybox:latest
    env:
      PLATFORM: ${{ matrix.platform }}
      IMAGES: ${{ matrix.images }}
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist

      - name: Check static and run on distros
        run: |
          set -uo pipefail
          chmod +x dist/*
          fail=0
          for bin in dist/*; do
            echo "=== $bin"
            file "$bin"
            if ! file "$bin" | grep -qE 'statically linked|static-pie linked'; then
              echo "::error::$bin is not statically linked"
              fail=1
            fi
            for img in $IMAGES; do
              timeout 60 docker run --rm --platform "$PLATFORM" -v "$PWD/dist:/dist:ro" "$img" "/$bin" --version
              code=$?
              case "$code" in
                125|126|127|132|134|135|139)
                  echo "::error::$bin failed on $img (exit $code)"
                  fail=1
                  ;;
                *)
                  echo "ok: $img (exit $code)"
                  ;;
              esac
            done
          done
          exit $fail

  release:
    needs: [meta, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      BIN: ${{ needs.meta.outputs.bin }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          chmod +x *
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Release notes
        run: |
          URL="https://github.com/$REPO/releases/download/$TAG"
          {
            echo "## Install (any Linux)"
            echo
            echo '```bash'
            echo 'case "$(uname -m)" in'
            echo '  x86_64) A=amd64 ;; aarch64|arm64) A=arm64 ;;'
            echo '  armv7l) A=armv7 ;; armv6l) A=armv6 ;; i?86) A=386 ;;'
            echo '  *) echo "unsupported arch"; exit 1 ;;'
            echo 'esac'
            echo "curl -fL -o $BIN \"$URL/$BIN-linux-\$A\""
            echo "chmod +x $BIN"
            echo "sudo mv $BIN /usr/local/bin/"
            echo '```'
            echo
            echo "| Arch | File |"
            echo "|---|---|"
            echo "| x86_64 | $BIN-linux-amd64 |"
            echo "| ARM64 (Pi 4/5 64-bit) | $BIN-linux-arm64 |"
            echo "| ARMv7 (Pi 2/3/4 32-bit) | $BIN-linux-armv7 |"
            echo "| ARMv6 (Pi Zero/1) | $BIN-linux-armv6 |"
            echo "| x86 32-bit | $BIN-linux-386 |"
            echo
            echo "Verify: sha256sum -c checksums-sha256.txt"
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: notes.md
          files: dist/*
          generate_release_notes: true
          make_latest: true
